{% extends 'transactions/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
        <h2>Login to your account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log in</button>
            <p>
                new to your wallet ? <a href="{% url 'register' %}" >Register</a> 
            </p>
        </form>
{% endblock %}
