{% extends 'transactions/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
    <div class="align-forms-narrower">
        <h2>Log in to your account</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_div }}
            <button class="btn btn-sm btn-primary mt-3 w-100" type="submit">Log in</button>
        </form>
        <p
          class="text-center text-body-secondary mt-3">New to your wallet? <a href="{% url 'register' %}">Register</a>
        </p>
    </div>
{% endblock %}
