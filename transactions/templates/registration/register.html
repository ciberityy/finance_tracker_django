{% extends 'transactions/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="align-forms-narrower">
    <h2>Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_div }}
        <button class="btn btn-sm btn-primary mt-3 w-100" type="submit">Register</button>
    </form>
    <p class="text-center text-body-secondary mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
