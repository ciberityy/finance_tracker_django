{% extends 'transactions/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}

<h2>Create an account</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Register</button>
    <p>
        Already have an account ? <a href ="{% url 'login' %}" >Log in </a> 
    </p>
</form> 
{% endblock %}
