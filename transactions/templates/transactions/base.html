{% load static %}

<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
        crossorigin="anonymous">
        
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
        <link rel="icon" href="{% static 'finance_tracker_favicon.ico' %}">
        
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
        crossorigin="anonymous"></script>
        
        <title>
            {% block title %}Finance Tracker{% endblock %}
        </title>
    </head>
        <body>
            <nav class="navbar app-navbar">
                <div class="container-fluid">
                    {% if user.is_authenticated %}
                        <a class="navbar-brand" href="{% url 'dashboard' %}">Your Wallet</a>
                        <div class="group-elements-r">
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button class="logout-btn" type="submit">Logout</button>
                            </form>
                            <span class="navbar-text">{{ user.username }}</span>
                        </div>
                    {% else %}
                        <span class="navbar-brand">Your Wallet</span>
                        <span class="navbar-text">Welcome !</span>
                    {% endif %}
                </div>
            </nav>
        {% block content %}{% endblock %}
    </body>
</html>
